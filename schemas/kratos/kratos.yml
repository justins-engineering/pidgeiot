version: v26.2.0

dsn: postgres://kratos:secret@127.0.0.1:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4

session:
  lifespan: 4h

# Browser-facing dev URLs say localhost, not 127.0.0.1: WebAuthn refuses an
# IP literal as an RP id, so passkeys only work when the page's effective
# domain is a real (if special-cased) domain -- and the page, Kratos, and
# the API must then share that one host, because the session/CSRF cookies
# are host-only and localhost/127.0.0.1 count as different sites. Bind
# addresses are unchanged; localhost resolves to the same loopback.
serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:4433
        - http://localhost:4455
        - http://127.0.0.1:4433
        - http://127.0.0.1:4455
        - http://127.0.0.1
        - http://localhost
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  default_browser_return_url: http://localhost:4455/
  allowed_return_urls:
    - http://localhost
    - http://127.0.0.1
    # The dashboard's own dev origins: fancier names its origin as the
    # return_to of every flow it starts, and Kratos matches host and port.
    - http://localhost:4455
    - http://127.0.0.1:4455
    - http://localhost:19006/Callback
    - exp://localhost:8081/--/Callback

  methods:
    password:
      enabled: true
    passkey:
      enabled: true
      config:
        rp:
          display_name: PidgeIoT
          # The RP id must be a registrable suffix of the page's host and a
          # valid domain -- see the localhost note on `serve` above.
          id: localhost
          origins:
            - http://localhost:4455
    totp:
      config:
        # What the authenticator app displays as the account's provider;
        # the software default would brand every entry "Kratos".
        issuer: PidgeIoT
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: http://localhost:4455/error

    settings:
      ui_url: http://localhost:4455/settings
      privileged_session_max_age: 15m
      required_aal: highest_available
      after:
        # Only the profile method: it is the one that can move a trait, and
        # a password or TOTP change firing this would be a round trip that
        # can only ever conclude nothing changed.
        profile:
          hooks:
            - hook: web_hook
              config:
                url: http://host.docker.internal:8787/internal/consent
                method: POST
                body: file:///opt/kratos/hooks/consent-settings.jsonnet
                # Consent evidence must never be the thing that stops
                # someone changing their own settings, so the result is
                # ignored and the call is made asynchronously. What that
                # costs is a lost row if dovecote is down; what it buys is
                # that a backend outage cannot take the settings page with
                # it. The trait still carries the person's choice, which is
                # what makes the loss recoverable -- see docs/consent.md.
                response:
                  ignore: true
                auth:
                  type: api_key
                  config:
                    name: X-Kratos-Hook-Secret
                    # Dev-only literal, and it must match KRATOS_HOOK_SECRET
                    # in the gitignored dovecote/.dev.vars. Staging and
                    # production hold their own value; see docs/consent.md.
                    value: dev-only-consent-hook-secret
                    in: header

    recovery:
      enabled: true
      ui_url: http://localhost:4455/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://localhost:4455/verification
      use: code
      after:
        default_browser_return_url: http://localhost:4455/session/local?state=true

    logout:
      after:
        default_browser_return_url: http://localhost:4455/session/local?state=false

    login:
      ui_url: http://localhost:4455/login
      lifespan: 10m
      after:
        default_browser_return_url: http://localhost:4455/session/local?state=true

    registration:
      lifespan: 10m
      ui_url: http://localhost:4455/registration
      # Kratos's default TWO-STEP registration (profile traits first,
      # password on a second step). Works end-to-end in a real browser:
      # fancier's FormBuilder posts a native <form>, Kratos 303s back to
      # ui_url, the SPA re-fetches the merged flow and renders the
      # password step. Inspecting the flow with `Accept: application/json`
      # shows only profile nodes on step 1 (Kratos's JSON path returns 400
      # + the next step's nodes) — that is NOT "registration is broken";
      # the native browser form path (Accept: text/html) works. Do not
      # re-add enable_legacy_one_step on that false alarm.
      after:
        default_browser_return_url: http://localhost:4455/session/local?state=true
        # Listed twice on purpose, and it does not double-fire. Kratos
        # picks ONE list per registration method: the method's own if it
        # has one, this global list otherwise -- verified by watching the
        # executor chain, where a web hook configured only here was
        # silently absent from a password registration. So the global copy
        # covers passkey and code, and `password` below needs its own.
        hooks:
          - &consent_registration_hook_entry
            hook: web_hook
            config:
              url: http://host.docker.internal:8787/internal/consent
              method: POST
              body: file:///opt/kratos/hooks/consent-registration.jsonnet
              # Consent evidence must never be the thing that stops
              # someone creating an account, so the result is ignored and
              # the call is made asynchronously. What that costs is a lost
              # row if dovecote is down; what it buys is that a backend
              # outage cannot take signup with it. The trait still carries
              # the person's choice, which is what makes the loss
              # recoverable -- see docs/consent.md.
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Kratos-Hook-Secret
                  # Dev-only literal, and it must match KRATOS_HOOK_SECRET
                  # in the gitignored dovecote/.dev.vars. Staging and
                  # production hold their own value; see docs/consent.md.
                  value: dev-only-consent-hook-secret
                  in: header
        password:
          # First, not last: `show_verification_ui` redirects, and a hook
          # that runs after a redirecting one is a hook that may not run.
          hooks:
            - *consent_registration_hook_entry
            - hook: session
            - hook: show_verification_ui

log:
  level: debug
  format: text
  leak_sensitive_values: true

secrets:
  default:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL
  cookie:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: argon2
  argon2:
    memory: 384MB
    iterations: 3
    parallelism: 16
    salt_length: 16
    key_length: 32
    expected_duration: 500ms
    expected_deviation: 500ms
    dedicated_memory: 1GB

identity:
  default_schema_id: user
  schemas:
    - id: user
      url: file:///opt/kratos/identity.user.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
  # Branded HTML/plaintext overrides for the verification/recovery email
  # flows, replacing Kratos's stock templates. Versioned as a subdirectory
  # (v1) rather than the bare courier-templates/ root so a
  # future redesign can land as v2/ and cut over by changing this one path,
  # without clobbering the previous version or requiring an in-place rewrite.
  # This path lives inside the same ./schemas/kratos bind mount
  # docker-compose.yml already uses for kratos.yml/identity.user.schema.json
  # (target /opt/kratos/ on the `kratos` service), so no separate volume
  # entry is needed for it to be visible in the container.
  template_override_path: /opt/kratos/courier-templates/v1
  # `template_override_path` above is Ory's documented mechanism and does
  # work for the subject line -- but on this image, the body (both HTML
  # and plaintext) silently falls back to Kratos's *built-in* stock body
  # wording instead of reading the override file, even for a trivial
  # single-line replacement with no template directives at all. No error
  # is logged (the built-in template renders fine), so this is easy to
  # miss without literally rendering a real email end-to-end.
  # The explicit per-flow `templates:` keys below use a different, independent
  # code path (Kratos fetches the `file://` URI itself rather than resolving
  # it via template_override_path's directory-glob lookup) and were verified
  # live to render the real branded HTML correctly. Kept both: the explicit
  # keys win (a non-empty subject/body URL here always takes priority over
  # template_override_path), so this is belt-and-suspenders, not redundant
  # dead config -- if a future Kratos version fixes the underlying bug,
  # template_override_path alone would already be sufficient and these keys
  # simply stop mattering.
  templates:
    recovery:
      valid:
        email:
          subject: file:///opt/kratos/courier-templates/v1/recovery/valid/email.subject.gotmpl
          body:
            html: file:///opt/kratos/courier-templates/v1/recovery/valid/email.body.gotmpl
            plaintext: file:///opt/kratos/courier-templates/v1/recovery/valid/email.body.plaintext.gotmpl
      invalid:
        email:
          subject: file:///opt/kratos/courier-templates/v1/recovery/invalid/email.subject.gotmpl
          body:
            html: file:///opt/kratos/courier-templates/v1/recovery/invalid/email.body.gotmpl
            plaintext: file:///opt/kratos/courier-templates/v1/recovery/invalid/email.body.plaintext.gotmpl
    recovery_code:
      valid:
        email:
          subject: file:///opt/kratos/courier-templates/v1/recovery_code/valid/email.subject.gotmpl
          body:
            html: file:///opt/kratos/courier-templates/v1/recovery_code/valid/email.body.gotmpl
            plaintext: file:///opt/kratos/courier-templates/v1/recovery_code/valid/email.body.plaintext.gotmpl
      invalid:
        email:
          subject: file:///opt/kratos/courier-templates/v1/recovery_code/invalid/email.subject.gotmpl
          body:
            html: file:///opt/kratos/courier-templates/v1/recovery_code/invalid/email.body.gotmpl
            plaintext: file:///opt/kratos/courier-templates/v1/recovery_code/invalid/email.body.plaintext.gotmpl
    verification:
      valid:
        email:
          subject: file:///opt/kratos/courier-templates/v1/verification/valid/email.subject.gotmpl
          body:
            html: file:///opt/kratos/courier-templates/v1/verification/valid/email.body.gotmpl
            plaintext: file:///opt/kratos/courier-templates/v1/verification/valid/email.body.plaintext.gotmpl
      invalid:
        email:
          subject: file:///opt/kratos/courier-templates/v1/verification/invalid/email.subject.gotmpl
          body:
            html: file:///opt/kratos/courier-templates/v1/verification/invalid/email.body.gotmpl
            plaintext: file:///opt/kratos/courier-templates/v1/verification/invalid/email.body.plaintext.gotmpl
    verification_code:
      valid:
        email:
          subject: file:///opt/kratos/courier-templates/v1/verification_code/valid/email.subject.gotmpl
          body:
            html: file:///opt/kratos/courier-templates/v1/verification_code/valid/email.body.gotmpl
            plaintext: file:///opt/kratos/courier-templates/v1/verification_code/valid/email.body.plaintext.gotmpl
      invalid:
        email:
          subject: file:///opt/kratos/courier-templates/v1/verification_code/invalid/email.subject.gotmpl
          body:
            html: file:///opt/kratos/courier-templates/v1/verification_code/invalid/email.body.gotmpl
            plaintext: file:///opt/kratos/courier-templates/v1/verification_code/invalid/email.body.plaintext.gotmpl

feature_flags:
  use_continue_with_transitions: true

sqa-opt-out: true
