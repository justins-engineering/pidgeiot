services:
  postgresd:
    image: postgres:18-alpine
    ports:
      # Loopback only -- Kratos reaches this over the compose network by
      # service name; the only off-container consumer is a developer's own
      # psql/client on the same machine (dovecote's dev Hyperdrive config
      # also points at 127.0.0.1).
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=kratos
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=kratos
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - intranet

  kratos-migrate:
    depends_on:
      - postgresd
    image: oryd/kratos:v26.2
    environment:
      - DSN=postgres://kratos:secret@postgresd:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
    volumes:
      - type: bind
        source: ../schemas/kratos
        target: /opt/kratos
    command: -c /opt/kratos/kratos.yml migrate sql -e --yes
    restart: on-failure
    networks:
      - intranet

  kratos:
    depends_on:
      - kratos-migrate
    image: oryd/kratos:v26.2
    ports:
      # Loopback only -- both are dashboard-user auth endpoints (fancier's
      # KRATOS_BROWSER_URL points at localhost:4433), never device-facing;
      # devices auth via dovecote's own Ed25519 token scheme, not Kratos.
      # The admin API is unauthenticated by design, so a wide bind here
      # would hand full identity control to anything else on the network.
      - '127.0.0.1:4433:4433' # public
      - '127.0.0.1:4434:4434' # admin
    restart: unless-stopped
    environment:
      - DSN=postgres://kratos:secret@postgresd:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
      - LOG_LEVEL=info
    command: serve -c /opt/kratos/kratos.yml --dev --watch-courier --sqa-opt-out
    volumes:
      # This one bind mount also covers courier.template_override_path
      # (kratos.yml) at /opt/kratos/courier-templates/v1 -- the branded
      # email templates live under ./schemas/kratos too, so no extra
      # volume entry is required for the container to see them.
      # --watch-courier (above) hot-reloads template edits without a restart.
      - type: bind
        source: ../schemas/kratos
        target: /opt/kratos/
    networks:
      - intranet

  kratos-admin-ui:
    depends_on:
      - kratos
    image: dhiagharsallaoui/kratos-admin-ui:latest
    ports:
      # Loopback only -- a developer-facing debug UI, browsed straight from
      # the host.
      - '127.0.0.1:3000:3000'
    environment:
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KRATOS_ADMIN_URL=http://kratos:4434
    networks:
      - intranet

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      # Loopback only -- Kratos's courier reaches SMTP capture over the
      # compose network by service name; the web UI is browsed straight
      # from the host. Nothing off-host has a reason to see captured mail.
      - '127.0.0.1:4436:4436'
      - '127.0.0.1:4437:4437'
    networks:
      - intranet

  # Pinned — an unpinned tag here would let dev and prod drift silently
  # (see dovecote's CLAUDE.md/wrangler.toml notes on GREPTIMEDB_ENDPOINT).
  # `v1.1.2` is what `:latest` resolved to at the time of pinning.
  greptimedb:
    image: greptime/greptimedb:v1.1.2
    ports:
      # Loopback only -- dovecote's dev GREPTIMEDB_ENDPOINT points at
      # 127.0.0.1:4000 because `wrangler dev` runs on the host, not in
      # docker, same as the other ports below (kept for direct SQL/gRPC
      # debugging from the host, never used by any in-container consumer).
      - '127.0.0.1:4000:4000' # HTTP (line-protocol write + SQL-over-HTTP read, both used by dovecote)
      - '127.0.0.1:4001:4001' # gRPC
      - '127.0.0.1:4002:4002' # MySQL wire
      - '127.0.0.1:4003:4003' # Postgres wire
    command: standalone start --http-addr 0.0.0.0:4000 --rpc-bind-addr 0.0.0.0:4001 --mysql-addr 0.0.0.0:4002 --postgres-addr 0.0.0.0:4003
    volumes:
      # Named volume — without it, all telemetry data is lost on every
      # `docker-compose down`. `/greptimedb_data` is GreptimeDB's own
      # default data-home inside the image.
      - greptimedb_data:/greptimedb_data
    networks:
      - intranet

networks:
  intranet:

volumes:
  greptimedb_data:
