[package]
name = "loft"
version = "0.1.0"
edition = "2024"
publish = false
description = "PidgeIoT CoAP terminator: DTLS/UDP + TLS/TCP (RFC 8323) front end translating the CoAP device surface onto dovecote's HTTP device routes"

[dependencies]
capsules.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "signal",
] }
# Async upstream client for the data path (dovecote /device/pigeons/:id/*).
# rustls, not native-tls: the upstream is ordinary HTTPS (Cloudflare edge /
# local wrangler dev) -- no PSK needed on this leg.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
] }
# Sync client for the PSK resolver ONLY: DTLS/TLS PSK callbacks are
# synchronous FFI-ish callbacks invoked mid-handshake, and bridging an async
# HTTP call into them is where the fragility lives -- a small blocking
# client behind `tokio::task::block_in_place` is simpler and correct on the
# multi-thread runtime. See src/psk.rs.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
openssl = "0.10"
# DTLSv1_listen for the DTLS listener's stateless cookie exchange -- the
# safe openssl crate does not expose it. See loft/src/dtls.rs module docs.
dtls-ffi-shim = { path = "../dtls-ffi-shim" }
