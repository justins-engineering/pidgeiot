name = "fancier"
compatibility_date = "2026-08-24"
send_metrics = false
# Keep version-preview URLs enabled on prod deploys: `versions upload -c
# wrangler.staging.toml --preview-alias <name>` attaches a quick preview of
# one build to this script (see that file), and a plain `wrangler deploy`
# would otherwise reset previews_enabled and break the alias (error 1042).
# workers_dev stays off: pidgeiot.com only.
preview_urls = true
workers_dev = false
# Markdown content negotiation (Cloudflare Agent Readiness: Markdown):
# worker/access-gate.mjs (Access vars unset in prod, so the gate is inert
# — see its header) delegates to worker/markdown.mjs, which serves the
# build-generated <route>/index.md variant to any request whose Accept
# header prefers text/markdown, and passes everything else through to
# ASSETS untouched (plus `Vary: Accept` on page routes). Which paths pay
# the worker hop at all is scoped by [assets].run_worker_first below.
main = "worker/access-gate.mjs"

[observability]
enabled = false

[[routes]]
pattern = "pidgeiot.com"
custom_domain = true
zone_name = "pidgeiot.com"

[assets]
directory = "../target/dx/fancier/release/web/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only the negotiable page routes invoke the worker; every other path
# (/assets/*, /wasm/*, robots.txt, the .md files themselves, SPA
# fallbacks for unknown routes, ...) keeps wrangler's zero-worker direct
# asset serving. Both slash forms are listed so a no-trailing-slash agent
# request negotiates immediately instead of only after the 307 redirect.
# KEEP IN SYNC with page-meta.json's `pages` map (which decides which
# routes get an index.md variant + Link header advertisement).
run_worker_first = [
  "/",
  "/features",
  "/features/",
  "/how-it-works",
  "/how-it-works/",
  "/use-cases",
  "/use-cases/",
  "/pricing",
  "/pricing/",
  "/compare",
  "/compare/",
  "/self-hosting",
  "/self-hosting/",
  "/documentation",
  "/documentation/",
  "/api-reference",
  "/api-reference/",
  "/architecture",
  "/architecture/",
  "/getting-started",
  "/getting-started/",
  "/demo",
  "/demo/",
  "/open-source",
  "/open-source/",
  "/about",
  "/about/",
  "/contact",
  "/contact/",
  "/privacy",
  "/privacy/",
  "/terms",
  "/terms/",
]

[build]
command = "./scripts/build-release.sh"
watch_dir = ["./src", "./worker"]

# Staging: a SEPARATE script, `fancier-staging` (wrangler's default
# `<name>-<env>` naming -- no `name` override, so this block can never be
# deployed over the production `fancier` script), on its own hostname.
# `wrangler deploy --env staging` is the staging deploy. A workers.dev or
# version-preview origin cannot hold a browser session: Kratos scopes its
# cookie to pidgeiot.com and admits exactly the origins it is configured
# with, and dovecote's CORS admits exactly its ROOT_URL. `main`, [assets]
# (run_worker_first included) and workers_dev = false are inherited; only
# the hostname and the build differ.
#
# The Access gate in worker/access-gate.mjs arms only when CF_ACCESS_AUD
# and CF_ACCESS_CERTS_URL are present, and they are never committed: pass
# them on every staging deploy (`--var CF_ACCESS_AUD:<aud> --var
# CF_ACCESS_CERTS_URL:<url>`), since a deploy without --keep-vars drops
# whatever vars the previous one set.
[env.staging]
routes = [{ pattern = "staging.pidgeiot.com", custom_domain = true, zone_name = "pidgeiot.com" }]

# FANCIER_ENV selects .env.staging (build.rs). Without this override the
# inherited command would bake production's API host into the bundle that
# is then uploaded as staging.
[env.staging.build]
command = "FANCIER_ENV=staging ./scripts/build-release.sh"
watch_dir = ["./src", "./worker"]
