[package]
name = "capsules"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
# Error-report signature grouping (errors.rs) -- same version dovecote
# already pins, pure Rust, wasm-safe.
sha2 = "0.10"

# `macros` (time::macros::datetime!) is test-only -- needed by
# connection_state's unit tests. Same per-crate feature-add pattern
# fancier/Cargo.toml uses for its own (non-test) need of this feature.
[dev-dependencies]
time = { workspace = true, features = ["macros"] }
