name = "dovecote"
compatibility_date = "2026-08-18"
send_metrics = false
main = "build/worker/shim.mjs"

[[routes]]
pattern = "api.pidgeiot.com"
custom_domain = true
zone_name = "pidgeiot.com"

[observability.logs]
enabled = true
invocation_logs = true
# 1.0: every invocation's logs are kept. At 0 every console_error! in the
# worker reported into nothing; Workers Observability includes 20M
# events/month, far above our volume, so full sampling is effectively free.
head_sampling_rate = 1

# GREPTIMEDB_ENDPOINT (all three [vars]/[env.*.vars] blocks below) -- the
# platform's optional GreptimeDB telemetry store, read via
# helpers/greptime.rs::greptime_origin. A bare origin (scheme+host+port),
# e.g. "http://127.0.0.1:4000" in dev, NOT a full path -- the read/write
# code appends its own "/v1/influxdb/write" / "/v1/sql" paths. Empty/unset
# falls back to the Postgres pigeon_telemetry_history path for every
# write/read (see write_telemetry_default/the telemetry/history routes in
# lib.rs). Only dev still points at a real instance (local docker-compose).
# To bring GreptimeDB back for an env: point this at its origin (plus, if
# it sits behind a Cloudflare Tunnel + Access policy, the ACCESS_CLIENT_*
# secrets below -- without them the Access gate 403s the Worker and
# telemetry silently falls back to Postgres history).
#
# DEMO_PIGEON_IDS (all three [vars]/[env.*.vars] blocks below) --
# comma-separated pigeon ids allowlisted for the public, unauthenticated
# GET /demo/pigeons/:id/telemetry* routes (helpers/demo.rs::is_demo_pigeon,
# lib.rs). Empty/unset means no pigeon is demo-eligible in that
# environment -- NOT "allow anything". Exact string match after splitting
# on ',' (whitespace-trimmed), so a typo just 404s rather than matching.
#
# GREPTIMEDB_DB (optional, per-env var) -- the GreptimeDB *database* the
# read/write paths target (helpers/greptime.rs::greptime_db). Unset → the
# built-in `public` database. Not set in any deployed env today, since no
# env points at a GreptimeDB instance (see above) -- but it exists so
# multiple envs sharing one self-hosted GreptimeDB instance can keep their
# telemetry in separate databases instead of colliding in `public`.
# ONE-TIME SETUP for any non-`public` name:
# GreptimeDB's InfluxDB write does not auto-create a missing database (it
# 400s "Failed to find schema"), so run `CREATE DATABASE <name>;` against
# the instance once (e.g. via its SQL HTTP endpoint) before pointing an env
# at it. Until then telemetry silently falls back to Postgres history
# rather than being lost.
#
# Companion Worker SECRETS (never here -- wrangler.toml is committed):
# GREPTIMEDB_AUTH_TOKEN (GreptimeDB's own HTTP auth, if the deployment has
# one -- local dev's docker GreptimeDB has none configured, so this stays
# unset in dev too) and GREPTIMEDB_ACCESS_CLIENT_ID/
# GREPTIMEDB_ACCESS_CLIENT_SECRET (the Cloudflare Access service-token
# pair this Worker presents so the Tunnel's Access policy lets it through
# -- only meaningful once staging/prod's tunnel exists; irrelevant in dev,
# which reaches the local docker instance directly with no Access gate).
# Set via `wrangler secret put <NAME> --env <env>`.
# COAP_DEVICE_HOST (all three [vars]/[env.*.vars] blocks) -- the host
# minted into a Coap-connector pigeon's `coaps://` endpoint
# (objects/pigeons.rs::coap_device_host). The CoAP terminator (`loft`, its
# own repo, runbook at docs/infra/coap-terminator.md there) is a separate deployment from this
# Worker: coap.pidgeiot.com must be a DNS-only (grey-cloud) record --
# Cloudflare's proxy carries neither raw UDP nor port 5684. Empty/unset
# falls back to DEVICE_API_HOST (the pre-terminator behavior; staging
# keeps that until a staging terminator exists). Port is implied: 5684 is
# the registered coaps port and the device client's default.
#
# Companion Worker SECRET (never here): COAP_SERVICE_SECRET -- the shared
# secret the terminator presents on GET /internal/coap-psk/:pigeon_id
# (same never-[vars] convention as RESEND_API_KEY; `wrangler secret put
# COAP_SERVICE_SECRET` per env, dovecote/.dev.vars for local dev). The
# route fails closed while it's unset.
#
# COAP_SERVICE_ALLOWED_IPS (all three [vars]/[env.*.vars] blocks) --
# comma-separated source addresses allowed to reach that same route
# (helpers/coap_service.rs), layered ahead of the secret check: the
# terminator's egress addresses, nothing else, matched against
# CF-Connecting-IP as parsed addresses. Empty/unset means the route
# denies every caller -- NOT "allow anything" (same fail-closed
# convention as DEMO_PIGEON_IDS). Deliberately its own var rather than
# derived from COAP_DEVICE_HOST: the name devices dial and the address
# the terminator egresses from are independent facts (NAT, a future
# load balancer) even though today both are the same VPS.
[vars]
KRATOS_BROWSER_URL = "https://auth.pidgeiot.com"
ROOT_URL = "https://pidgeiot.com"
DEVICE_API_HOST = "api.pidgeiot.com"
COAP_DEVICE_HOST = "coap.pidgeiot.com"
# Recipient for platform-ops notifications (helpers/ops_probe.rs -- the
# 5-minute cron's Kratos readiness probe emails state TRANSITIONS here via
# Resend). Doubles as the probe's only enable switch: set in production
# alone, deliberately absent from [env.staging.vars]/[env.dev.vars] so
# their identical cron handlers never probe or email.
OPS_ALERT_EMAIL = "code@jes.contact"
# Production demo pigeon (see the DEMO_PIGEON_IDS note above).
DEMO_PIGEON_IDS = "44e81fc18f5beddf8cabf57c3decd16ad1b7d24dd629213c2c4ac9038e50b03f"
# Greptime folded into Postgres: empty → every telemetry write/read uses
# the Postgres pigeon_telemetry_history fallback (Crunchy Bridge via
# Hyperdrive). The Proxmox GreptimeDB instance and its
# telemetry.pidgeiot.com tunnel route are retired with the rest of the
# home-lab box; re-point this at a real origin to bring GreptimeDB back.
GREPTIMEDB_ENDPOINT = ""
# loft's egress on the VPS -- the same box coap.pidgeiot.com's A record
# points at, which has no IPv6 egress, so this single v4 address is the
# only one Cloudflare can ever see the terminator arrive from. Must move
# with the VPS (the loft repo's docs/infra/coap-terminator.md, "Internal
# PSK route allowlist").
COAP_SERVICE_ALLOWED_IPS = "15.204.254.3"

[[hyperdrive]]
binding = "YugabyteDB"
id = "f2c59dfa75114889815fd453ac0db62a"

# Per-IP throttle on the unauthenticated POST /errors ingest. Counters are
# roughly per-colo, so this bounds request volume, not the ops inbox --
# the new-signature email has its own global budget (helpers/errors.rs).
# Each environment gets its own namespace_id: bindings sharing a namespace
# share counters across Workers.
[[ratelimits]]
name = "ERROR_INGEST_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[durable_objects]
bindings = [{ name = "PIGEONS", class_name = "Pigeons" }]

# Firmware image storage — signed MCUboot application binaries, ~300KB-1MB
# each, capped at capsules::MAX_FIRMWARE_BYTES (2MB) on upload. DO SQLite
# cannot hold blobs this size, so they live in R2 instead, content-addressed
# by sha256 (`firmware/<sha256>.bin`); catalog metadata (version, size,
# sha256, uploaded_at) lives in Postgres, per flock. Each environment gets
# its own bucket, matching the telemetry queues' per-env pattern below.
[[r2_buckets]]
binding = "FIRMWARE_BUCKET"
bucket_name = "pidgeiot-firmware"

# Production telemetry queue. Same design as staging below: auth happens
# synchronously at ingestion, the consumer only writes messages that
# already passed the DO bearer-token check. Each environment needs its own
# queue — Cloudflare allows exactly one consumer worker per queue, so
# prod (`dovecote`) owns `pidgeiot-telemetry` and staging
# (`dovecote-staging`) owns `pidgeiot-telemetry-staging`, matching the
# script naming convention.
[[queues.producers]]
queue = "pidgeiot-telemetry"
binding = "TELEMETRY_QUEUE"

[[queues.consumers]]
queue = "pidgeiot-telemetry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Pigeons"]

# Missing-heartbeat / device-state alert sweep -- absence-of-data
# conditions can't be triggered by an ingest event by definition, since
# nothing arrives to trigger them. Every 5 minutes is a starting cadence:
# frequent enough that a `MissingReport`/`DeviceState` alert's own
# configurable window/duration (not this cron's interval) governs how
# quickly it fires, cheap enough that one Postgres query plus a handful of
# per-pigeon lookups every 5 minutes is a non-issue on Workers' cron
# pricing. Handled by the `#[event(scheduled)]` handler in
# `src/scheduled.rs`, which calls `helpers::alerts::evaluate_scheduled_alerts`
# -- best-effort/logged throughout.
[triggers]
crons = ["*/5 * * * *"]

[build]
command = "cargo install -q worker-build && worker-build --release"
watch_dir = ["./src"]

# Staging: a SEPARATE script named `dovecote-staging` (wrangler's default
# `<name>-<env>` naming — no `name` override, so this can never target the
# production `dovecote` script). Exists because version-preview URLs are not
# generated for Workers that implement a Durable Object
# (https://developers.cloudflare.com/workers/configuration/previews/), so the
# preview-alias staging model used by fancier is impossible here.
# `routes = []` overrides the inherited api.pidgeiot.com custom domain;
# staging is reachable only at dovecote-staging.<subdomain>.workers.dev.
# Fresh DO namespace (staging pigeons/tokens are disjoint from prod);
# staging also has its own Hyperdrive binding/database (see below), so
# prod and staging share no data plane.
[env.staging]
workers_dev = true
routes = []

# Same missing-heartbeat sweep as the production block above -- staging
# gets its own cron since it's a wholly separate Worker script
# (`dovecote-staging`), evaluating staging's own disjoint alert
# definitions.
[env.staging.triggers]
crons = ["*/5 * * * *"]

[env.staging.vars]
KRATOS_BROWSER_URL = "https://auth.pidgeiot.com"
ROOT_URL = "https://staging-fancier.justinsengineeringservices.workers.dev"
DEVICE_API_HOST = "dovecote-staging.justinsengineeringservices.workers.dev"
# No staging terminator yet -- empty falls back to DEVICE_API_HOST (see
# the COAP_DEVICE_HOST note above the production [vars] block).
COAP_DEVICE_HOST = ""
# Staging's own demo pigeon (see the DEMO_PIGEON_IDS note above) -- lives in
# the "Demo Flock" flock, created for this purpose; NOT the prod demo id.
DEMO_PIGEON_IDS = "0ec346b8c062431d0bada55f93ffa6089c6fd35eda5d64c75aff0381c4ea12a3"
# Greptime folded into Postgres, same as prod: empty → Postgres
# pigeon_telemetry_history fallback for both writes and reads. GREPTIMEDB_DB
# is gone with it -- it only ever namespaced staging inside the shared
# Greptime instance; the Postgres path needs no equivalent since staging has
# its own database (see the Hyperdrive block below).
GREPTIMEDB_ENDPOINT = ""
# No staging terminator (see COAP_DEVICE_HOST above), so no address may
# call staging's internal PSK route: empty is a deliberate deny-all, not
# an oversight. A future staging terminator lists its egress here.
COAP_SERVICE_ALLOWED_IPS = ""

[env.staging.durable_objects]
bindings = [{ name = "PIGEONS", class_name = "Pigeons" }]

[[env.staging.r2_buckets]]
binding = "FIRMWARE_BUCKET"
bucket_name = "pidgeiot-firmware-staging"

# Own namespace_id -- see the production ratelimits block above.
[[env.staging.ratelimits]]
name = "ERROR_INGEST_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[env.staging.hyperdrive]]
binding = "YugabyteDB"
# dovecote-db-staging: staging's OWN database (dovecote_staging on the
# same Crunchy cluster, dedicated role locked out of the prod DB) -- prod
# and staging don't share a data plane, so staging-created flocks/pigeons
# can't ghost into prod dashboard lists.
id = "853acbf7f59246bd89d38faaf01ff58e"

# Staging telemetry queue -- see the production block above for the shared
# design rationale. Device auth still happens synchronously at ingestion
# (POST /device/pigeons/:id/telemetry verifies the bearer token against
# the DO before enqueueing anything — see
# verify_device_via_do/verify_telemetry_device); the consumer only ever
# writes messages that already passed that check. Environments without
# this binding (dev) fall back to the synchronous direct-DO-write path in
# src/lib.rs.
[[env.staging.queues.producers]]
queue = "pidgeiot-telemetry-staging"
binding = "TELEMETRY_QUEUE"

[[env.staging.queues.consumers]]
queue = "pidgeiot-telemetry-staging"

# Same sweep as prod/staging. `wrangler dev` doesn't fire this on a real
# timer, but it can be exercised on demand via
# `curl "http://127.0.0.1:8787/cdn-cgi/handler/scheduled?cron=*/5+*+*+*+*"`
# (wrangler's local scheduled-event test endpoint).
[env.dev.triggers]
crons = ["*/5 * * * *"]

[env.dev.vars]
KRATOS_BROWSER_URL = "http://127.0.0.1:4433"
ROOT_URL = "http://127.0.0.1:4455"
DEVICE_API_HOST = "127.0.0.1:8787"
# Local terminator from the loft repo (`cargo run -p loft` there; defaults
# to 0.0.0.0:5684, and the coaps
# port 5684 is implied by the scheme, so no port suffix here).
COAP_DEVICE_HOST = "127.0.0.1"
# No demo pigeon in dev -- empty, not unset, matching the other per-env
# vars' pattern of every environment declaring the key explicitly.
DEMO_PIGEON_IDS = ""
# `wrangler dev` sets CF-Connecting-IP to the local client's socket
# address; both loopback literals because a connect over v6 presents a
# real `::1`, which is not an IPv4-mapped form and so is deliberately NOT
# normalized to 127.0.0.1 (a mapped `::ffff:127.0.0.1` is -- see
# helpers/coap_service.rs).
COAP_SERVICE_ALLOWED_IPS = "127.0.0.1,::1"
# Local docker-compose GreptimeDB (docker-compose.yml's `greptimedb`
# service) -- reachable directly, no Cloudflare Tunnel/Access in dev, and
# no auth configured on the local instance either, so neither
# GREPTIMEDB_AUTH_TOKEN nor the GREPTIMEDB_ACCESS_CLIENT_* secrets are
# needed here.
GREPTIMEDB_ENDPOINT = "http://127.0.0.1:4000"

[env.dev.durable_objects]
# the `class_name` uses the Rust struct identifier name
bindings = [{ name = "PIGEONS", class_name = "Pigeons" }]

# `wrangler dev` (local mode, the default) emulates R2 buckets locally via
# Miniflare regardless of whether `bucket_name` matches a real remote
# bucket, so this doesn't need its own `wrangler r2 bucket create` — named
# distinctly from staging/production purely for clarity in logs.
[[env.dev.r2_buckets]]
binding = "FIRMWARE_BUCKET"
bucket_name = "pidgeiot-firmware-dev"

# Own namespace_id -- see the production ratelimits block above.
[[env.dev.ratelimits]]
name = "ERROR_INGEST_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[env.dev.hyperdrive]]
binding = "YugabyteDB"
id = ""
localConnectionString = "postgres://kratos:secret@127.0.0.1:5432/dovecote?sslmode=disable"

[[env.dev.routes]]
pattern = "127.0.0.1"
custom_domain = true
